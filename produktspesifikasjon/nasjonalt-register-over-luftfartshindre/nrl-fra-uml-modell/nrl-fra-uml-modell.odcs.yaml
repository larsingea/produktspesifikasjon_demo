      value: LuftspennType
    - property: asDictionary
      value: 'true'
    description: type luftfartshinder registrert som luftspenn
    required: true
  - name: luftspennMerknad
    logicalType: object
    properties:
    - name: farligspenn
      logicalType: boolean
      description: luftspenn som i form av sin beliggenhet er spesielt farlig/viktig
        å være klar over i forbindelse med lavtflyging
    - name: farligspennMerknad
      logicalType: string
      description: utfyllende informasjon om aktuelt farlig luftspenn
    description: viktige merknader tilknyttet dette luftspennet
  - name: anleggsbredde
    logicalType: number
    description: 'luftfartshinderets maksimale bredde


      Enhet: meter'
  - name: beliggenhet
    logicalType: object
    physicalType: geometry(LineString)
    required: true
