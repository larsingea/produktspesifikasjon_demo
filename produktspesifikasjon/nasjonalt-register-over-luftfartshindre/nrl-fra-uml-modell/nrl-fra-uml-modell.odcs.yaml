# Open Data Contract Standard (ODCS) v3.1.0 — generert fra datamodellen.
apiVersion: v3.1.0
kind: DataContract
id: urn:odcs:nasjonalt-register-over-luftfartshindre-nrl-fra-uml-modell:1.0.0
version: 1.0.0
status: active
name: Nasjonalt register over luftfartshindre - NRL  fra UML-modell
schema:
- name: NrlLuftspenn
  physicalName: nrlluftspenn
  logicalType: object
  physicalType: table
  description: Objekt som er representert som et luftspenn i NRL
  customProperties:
  - property: sosiObjektType
    value: NrlLuftspenn
  - property: inheritsFrom
    value: Fellesegenskaper
  - property: associations
    value:
    - role: harMast
      target: NrlMast
      cardinality: 0..2
  properties:
  - name: identifikasjon
    logicalType: object
    properties:
    - name: lokalId
      logicalType: string
      description: 'lokal identifikator av et objekt


        Merknad: Det er dataleverandørens ansvar å sørge for at den lokale identifikatoren
        er unik innenfor navnerommet.'
      required: true
    - name: navnerom
      logicalType: string
      description: 'navnerom som unikt identifiserer datakilden til et objekt


        Merknad : Verdien for navnerom vil eies av den dataprodusent som har ansvar
        for de unike identifikatorene og må være registrert i data.geonorge.no eller
        data.norge.no'
      required: true
    - name: versjonId
      logicalType: string
      description: 'identifikasjon av en spesiell versjon av et geografisk objekt
        (instans)


        Merknad: Angis i form av dato og tid'
    description: unik identifikasjon av et objekt
    required: true
  - name: oppdateringsdato
    logicalType: timestamp
    description: 'tidspunkt for siste endring på objektet


      Merknad:

      Oppdateringsdato refererer til en endring av dataene i registeret. Dataene kan
      dermed endres som følge av en forvaltningsmessig beslutning uten at det virkelige
      objektet i terrenget er endret.'
    required: true
  - name: status
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/luftfartshinder/nrl-distribusjon/2.0/status
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: Status
    - property: asDictionary
      value: 'true'
    description: objektets tilstand
    required: true
  - name: verifisertRapporteringsnøyaktighet
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/luftfartshinder/nrl-rapportering/1.0/verifisertrapporteringsnøyaktighet
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: VerifisertRapporteringsnøyaktighet
    - property: asDictionary
      value: 'true'
    description: objekteiers verifikasjon av at objektet som er meldt inn til NRL
      oppfyller kravene til rapporteringsnøyaktighet angitt i luftfartshinderforskriften
    required: true
  - name: registreringsdato
    logicalType: timestamp
    description: 'dato for første registrering av objektet i NRL


      Merknad:

      For luftfartshinder førstegangsregistrert før 2014-03-28 er registreringsdato
      satt til 2014-03-28.'
    required: true
  - name: navn
    logicalType: string
    description: navn på objekt i de tilfeller hvor dette har relevans, f.eks. Tryvannstårnet,
      Gullfaks C, Stolheis Hafjell 360, Hardangerbrua, osv.
  - name: vertikalAvstand
    logicalType: number
    description: 'maksimal avstand i vertikalplanet fra objektet til underliggende
      terreng eller vannoverflate


      Angis dersom vertikal avstand er større enn 15 meter.


      Enhet: meter'
  - name: luftfartshindermerking
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/luftfartshinder/nrl-rapportering/1.0/luftfartshindermerking
