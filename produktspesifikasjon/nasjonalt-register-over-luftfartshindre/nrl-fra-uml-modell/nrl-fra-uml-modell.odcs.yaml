      Merknad:

      Skal være angitt dersom objektet har høydeverdi ("<i>høyde over havet</i>")'
  - name: informasjon
    logicalType: string
    description: utfyllende tekst
  - name: luftspennType
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/luftfartshinder/nrl-distribusjon/2.0/luftspenntype
      type: businessDefinition
    customProperties:
